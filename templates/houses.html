{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block main %}
<div class="page-head"><h1>{{ title }}</h1></div>
<form method="get" class="filter">
  <label>Trạng thái
    <select name="trang_thai" onchange="this.form.submit()">
      {% for k, v in STATUS.items() %}<option value="{{ k }}" {{ 'selected' if k == filter }}>{{ v[0] }}</option>{% endfor %}
    </select>
  </label>
  <noscript><button>Lọc</button></noscript>
</form>
{% with show_ctv = true, empty_msg = 'Không có hồ sơ ở trạng thái này.' %}{% include "_house_rows.html" %}{% endwith %}
{% endblock %}
